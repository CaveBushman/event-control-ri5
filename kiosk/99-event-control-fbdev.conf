# Malý SPI displej (fbtft) nenabízí KMS, jen framebuffer /dev/fb0.
# Bez tohohle souboru by X hledal GPU, žádné nenašel a nespustil se —
# stejně jako cage. Instaluje ho deploy.sh, a jen na krabičce bez /dev/dri.
Section "Device"
    Identifier "EventControlFramebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection
